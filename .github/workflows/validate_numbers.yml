name: Validate Numbers

on:
  push:
    paths:
      - '**.tex'
      - 'results/**'
  pull_request:
    paths:
      - '**.tex'
      - 'results/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pandas scipy
    
    - name: Run number validation
      run: |
        python validate_numbers.py
